name: Tests

on:
  pull_request:

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build better-sqlite3 for the runner's node
        run: pnpm --dir node_modules/better-sqlite3 exec prebuild-install
      - name: Quality checks
        run: pnpm run lint && pnpm run format:check && pnpm run typecheck
      - name: Check translations
        run: pnpm run i18n:check
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Run tests
        # The gates above fail on drift that has nothing to do with the suite —
        # a stray format nit, a missing locale key, a fresh advisory. Without
        # this the job stops there and the PR reports no test result at all.
        if: ${{ !cancelled() }}
        run: pnpm test
        env:
          # a skipped DB test here means the rebuild step above is gone: fail instead
          REQUIRE_DB_TESTS: "1"
